<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Western Mobile Storage — Rental & Billing Tracker</title>
<style>
  :root {
    --bg:#eef1ec; --surface:#ffffff; --surface-2:#f5f7f3; --ink:#161d18;
    --muted:#5b6b60; --line:#d6ddd5; --primary:#004812; --primary-2:#0a691e;
    --stripe:#51B948;
    --ok:#1f7a4d; --ok-bg:#e4f1ea; --rent:#1f5fa8; --rent-bg:#e6eef8;
    --warn:#946610; --warn-bg:#f6ecd3; --off:#55626f; --off-bg:#e7ecf0;
    --danger:#b3382c; --danger-bg:#f7e3e0; --credit:#6b4fa0; --credit-bg:#ece6f5;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.45; }
  .mono { font-family:var(--mono); }

  header.top { background:var(--primary); color:#fff; border-top:4px solid var(--stripe); padding:14px 20px 0; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:40px; height:34px; border-radius:6px; background:var(--stripe); display:flex; align-items:center; justify-content:center; color:var(--primary); font-weight:800; font-family:var(--mono); font-size:12px; letter-spacing:-0.5px; }
  .brand h1 { font-size:17px; margin:0; letter-spacing:.2px; font-weight:650; }
  .brand p { margin:0; font-size:11.5px; color:#b7d2c1; letter-spacing:.4px; text-transform:uppercase; }
  nav.tabs { display:flex; gap:2px; margin-top:14px; overflow-x:auto; }
  nav.tabs button { background:transparent; border:0; color:#a8c6b3; padding:11px 16px; cursor:pointer; font-size:13.5px; font-weight:550; border-bottom:3px solid transparent; white-space:nowrap; font-family:var(--font); }
  nav.tabs button:hover { color:#fff; }
  nav.tabs button.on { color:#fff; border-bottom-color:var(--stripe); }

  main { max-width:1260px; margin:0 auto; padding:22px 20px 60px; }
  .pagehead { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .pagehead h2 { margin:0; font-size:19px; font-weight:650; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .count { font-size:12.5px; color:var(--muted); margin-left:6px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; position:relative; overflow:hidden; }
  .kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,var(--primary)); }
  .kpi .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:600; }
  .kpi .val { font-size:24px; font-weight:700; font-family:var(--mono); margin-top:4px; letter-spacing:-.5px; }
  .kpi .hint { font-size:12px; color:var(--muted); margin-top:2px; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:720px){ .grid2 { grid-template-columns:1fr; } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:18px; }
  .panel h3 { margin:0 0 4px; font-size:14px; font-weight:650; }
  .panel .panel-sub { margin:0 0 12px; font-size:12.5px; color:var(--muted); }
  .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .stage-badge { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff; font-size:11.5px; font-weight:700; font-family:var(--mono); flex-shrink:0; }

  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .search { flex:1; min-width:180px; }
  input.in, select.in, textarea.in { width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; font-family:var(--font); background:#fff; color:var(--ink); }
  input.in:focus, select.in:focus, textarea.in:focus { outline:2px solid var(--primary-2); outline-offset:-1px; border-color:var(--primary-2); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:20px; padding:6px 12px; font-size:12.5px; cursor:pointer; font-weight:550; font-family:var(--font); }
  .chip.on { background:var(--primary); color:#fff; border-color:var(--primary); }

  .btn { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:7px; padding:8px 14px; font-size:13px; cursor:pointer; font-weight:600; font-family:var(--font); display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:var(--surface-2); }
  .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn.primary:hover { background:var(--primary-2); }
  .btn.ghost { background:transparent; }
  .btn.danger { color:var(--danger); border-color:#e8c4bf; }
  .btn.danger:hover { background:var(--danger-bg); }
  .btn.sm { padding:5px 9px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th { text-align:left; padding:10px 12px; background:var(--surface-2); color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:650; border-bottom:1px solid var(--line); white-space:nowrap; }
  .tbl td { padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .tbl tr:last-child td { border-bottom:0; }
  .tbl tbody tr:hover td { background:var(--surface-2); }
  .cid { font-family:var(--mono); font-weight:600; letter-spacing:.5px; }
  .num { font-family:var(--mono); }
  .money { font-family:var(--mono); font-weight:650; }
  .muted { color:var(--muted); }
  .right { text-align:right; }
  .nowrap { white-space:nowrap; }
  .subline { font-size:11.5px; color:var(--muted); margin-top:2px; }

  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:650; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .b-ok { color:var(--ok); background:var(--ok-bg); }
  .b-rent { color:var(--rent); background:var(--rent-bg); }
  .b-warn { color:var(--warn); background:var(--warn-bg); }
  .b-off { color:var(--off); background:var(--off-bg); }
  .b-danger { color:var(--danger); background:var(--danger-bg); }
  .b-credit { color:var(--credit); background:var(--credit-bg); }

  .empty { text-align:center; padding:44px 20px; color:var(--muted); }
  .empty h3 { color:var(--ink); margin:0 0 6px; font-size:16px; }
  .empty p { margin:0 0 16px; }
  .empty-row { text-align:center; padding:22px; color:var(--muted); font-size:13px; }

  .overlay { position:fixed; inset:0; background:rgba(15,25,35,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto; }
  .modal { background:#fff; border-radius:12px; width:100%; max-width:560px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .modal-head { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .modal-head h3 { margin:0; font-size:16px; }
  .modal-body { padding:20px; display:grid; gap:14px; max-height:70vh; overflow-y:auto; }
  .modal-foot { padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
  .x { border:0; background:transparent; font-size:22px; line-height:1; cursor:pointer; color:var(--muted); }
  .fld label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13.5px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .listrow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .bar { height:8px; background:var(--surface-2); border-radius:20px; overflow:hidden; margin-top:8px; }
  .bar > span { display:block; height:100%; background:var(--primary); }
  .savenote { font-size:11.5px; color:#b7d2c1; margin-top:6px; }
  .banner { background:var(--warn-bg); color:var(--warn); border:1px solid #e9d6a3; border-radius:8px; padding:10px 14px; font-size:12.5px; margin-bottom:16px; }
  .formula { background:var(--surface-2); border:1px dashed var(--line); border-radius:8px; padding:8px 11px; font-size:12px; color:var(--muted); font-family:var(--mono); }
</style>
</head>

  function uid() {

  }

  /* ------------------------- date / proration math ------------------------- */
  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); } // m is 1-indexed month
  function parts(dateStr) {
    var p = dateStr.split("-");
    return { y: +p[0], m: +p[1], d: +p[2] };
  }
  function daysInMonthOf(dateStr) { var p = parts(dateStr); return daysInMonth(p.y, p.m); }
  function dayOfMonth(dateStr) { return parts(dateStr).d; }
  // Proration: daily rate = monthly fee / actual days in that calendar month.
  function dailyRate(monthlyFee, dateStr) { return (Number(monthlyFee) || 0) / daysInMonthOf(dateStr); }
  function remainingDaysAfter(dateStr) { return daysInMonthOf(dateStr) - dayOfMonth(dateStr); }
  function nextMonthProrate(monthlyFee, deliveryDateStr) {
    return round2(dailyRate(monthlyFee, deliveryDateStr) * remainingDaysAfter(deliveryDateStr));
  }
  function returnProrateCredit(monthlyFee, returnDateStr) {
    return round2(dailyRate(monthlyFee, returnDateStr) * remainingDaysAfter(returnDateStr));
  }
  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
  function monthsElapsedCalendar(startDateStr, asOfStr) {
    var s = parts(startDateStr), a = parts(asOfStr);
    return (a.y * 12 + a.m) - (s.y * 12 + s.m);
  }

  /* ------------------------- supabase sync ------------------------- */
  function toSnake(s) { return s.replace(/([A-Z])/g, "_$1").toLowerCase(); }
  function toCamel(s) { return s.replace(/_([a-z])/g, function (_, c) { return c.toUpperCase(); }); }
  function rowToDb(row) {
    var out = {};
    Object.keys(row).forEach(function (k) { out[toSnake(k)] = row[k]; });
    return out;
  }
  function rowFromDb(row) {
    var out = {};
    Object.keys(row).forEach(function (k) { out[toCamel(k)] = row[k]; });
    return out;
  }
  var TABLE_KEYS = { containers: "id", customers: "id", rentals: "id", invoices: "id", collections: "account" };

  async function syncTable(table, rows) {
    var idField = TABLE_KEYS[table];
    var localIds = rows.map(function (r) { return r[idField]; });
    var sel = await sb.from(table).select(idField);
    if (sel.error) throw sel.error;
    var existingIds = (sel.data || []).map(function (r) { return r[idField]; });
    var toDelete = existingIds.filter(function (id) { return localIds.indexOf(id) === -1; });
    if (toDelete.length) {
      var del = await sb.from(table).delete().in(idField, toDelete);
      if (del.error) throw del.error;
    }
    if (rows.length) {
      var up = await sb.from(table).upsert(rows.map(rowToDb));
      if (up.error) throw up.error;
    }
  }

  async function persist() {
    if (!sb) return;
    try {
      await Promise.all([
        syncTable("containers", state.containers),
        syncTable("customers", state.customers),
        syncTable("rentals", state.rentals),
        syncTable("invoices", state.invoices),
        syncTable("collections", state.collections)
      ]);
    } catch (e) {
      flash("Sync error — your change may not have saved: " + (e.message || e));
    }
  }

  async function loadAllFromSupabase() {
    try {
      var results = await Promise.all([
        sb.from("containers").select("*"),
        sb.from("customers").select("*"),
        sb.from("rentals").select("*"),
        sb.from("invoices").select("*"),
        sb.from("collections").select("*")
      ]);
      for (var i = 0; i < results.length; i++) if (results[i].error) throw results[i].error;
      state.containers = results[0].data.map(rowFromDb);
      state.customers = results[1].data.map(rowFromDb);
      state.rentals = results[2].data.map(rowFromDb);
      state.invoices = results[3].data.map(rowFromDb);
      state.collections = results[4].data.map(rowFromDb).map(migrateCollectionRecord);
      render();
    } catch (e) {
      flash("Couldn't load data from Supabase: " + (e.message || e));
    }
  }

  var realtimeChannel = null, refreshTimers = {};
  function subscribeRealtime() {
    if (!sb) return;
    if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    function refresh(table) {
      clearTimeout(refreshTimers[table]);
      refreshTimers[table] = setTimeout(function () { refetchTable(table); }, 500);
    }
    realtimeChannel = sb.channel("wms-tracker-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "containers" }, function () { refresh("containers"); })
      .on("postgres_changes", { event: "*", schema: "public", table: "customers" }, function () { refresh("customers"); })
      .on("postgres_changes", { event: "*", schema: "public", table: "rentals" }, function () { refresh("rentals"); })
      .on("postgres_changes", { event: "*", schema: "public", table: "invoices" }, function () { refresh("invoices"); })
      .on("postgres_changes", { event: "*", schema: "public", table: "collections" }, function () { refresh("collections"); })
      .subscribe();
  }
  async function refetchTable(table) {
    var res = await sb.from(table).select("*");
    if (res.error) return;
    var mapped = res.data.map(rowFromDb);
    if (table === "collections") mapped = mapped.map(migrateCollectionRecord);
    state[table] = mapped;
    render();
  }

  function metrics() {
    var total = state.containers.length, rented = 0, available = 0, maint = 0;
    state.containers.forEach(function (c) {
      var s = effStatus(c);
      if (s === "Rented") rented++;
      else if (s === "Available") available++;
      else if (s === "Maintenance") maint++;

    state.rentals.forEach(function (r) { if (!r.endDate) mrr += Number(r.monthlyRate) || 0; });
    var outstanding = 0, overdue = [], overdueAmt = 0;
    state.invoices.forEach(function (i) {
      if (i.status === "unpaid") { outstanding += Number(i.amount) || 0; if (isOverdue(i)) { overdue.push(i); overdueAmt += Number(i.amount) || 0; } }
    });

    var pendingRecurring = state.rentals.filter(needsRecurringFlag).length;
    return {
      total: total, rented: rented, available: available, maint: maint, mrr: mrr,
      outstanding: outstanding, overdue: overdue, overdueAmt: overdueAmt,
      util: total ? Math.round((rented / total) * 100) : 0, byType: byType,

  function migrateCollectionRecord(c) {
    if (c.stage && Array.isArray(c.notes)) return c;

    return Object.assign({}, c, {

      notes: Array.isArray(c.notes) ? c.notes : [{ id: uid(), date: today(), text: seedText }]

        "<p>Load your real rental log data to get started, or add records by hand.</p>" +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn primary" data-act="load-sample">Load Western Mobile Storage rental data</button>' +
        '<button class="btn" data-act="tab" data-tab="fleet">Add my first container</button>' +
        "</div></div>";
      return;
    }

    if (ui.tab === "dashboard") renderDashboard(v);
    else if (ui.tab === "fleet") renderFleet(v);
    else if (ui.tab === "customers") renderCustomers(v);
    else if (ui.tab === "rentals") renderRentals(v);
    else if (ui.tab === "billing") renderBilling(v);
    else if (ui.tab === "collections") renderCollections(v);

    v.insertAdjacentHTML("beforeend",
      '<div style="margin-top:28px;display:flex;justify-content:flex-end">' +
      '<button class="btn ghost sm muted" data-act="reset-all">Reset all data</button></div>');
  }

  /* --------------------------- dashboard --------------------------- */
  function renderDashboard(v) {
    var m = metrics();
    function kpi(lbl, val, hint, color) {
      return '<div class="kpi" style="--accent:' + color + '"><div class="lbl">' + lbl + '</div><div class="val">' + val + "</div>" +
        (hint ? '<div class="hint">' + hint + "</div>" : "") + "</div>";
    }
    var overdue = m.overdue.slice().sort(function (a, b) { return a.dueDate.localeCompare(b.dueDate); }).slice(0, 6);
    var maintList = state.containers.filter(function (c) { var s = effStatus(c); return s === "Maintenance" || s === "Out of Service"; }).slice(0, 6);

    var overdueHTML = overdue.length === 0
      ? '<p class="muted" style="margin:0">Nothing overdue. Nice.</p>'
      : '<div class="list">' + overdue.map(function (i) {
          return '<div class="listrow"><div><div style="font-weight:600">' + esc(customerName(i.customerId)) + "</div>" +
            '<div class="muted mono" style="font-size:12px">' + esc(i.number) + " · due " + i.dueDate + "</div></div>" +
            '<span class="money" style="color:var(--danger)">' + money(i.amount) + "</span></div>";
        }).join("") +
        '<button class="btn sm" style="align-self:flex-start;margin-top:4px" data-act="tab" data-tab="billing">Go to billing →</button></div>';

    var byTypeHTML = m.byType.map(function (x) {
      return '<div><div style="display:flex;justify-content:space-between;font-size:13px"><span>' + esc(x.t) + '</span><span class="mono muted">' + x.n + "</span></div>" +
        '<div class="bar"><span style="width:' + (x.n / m.total * 100) + '%"></span></div></div>';
    }).join("");

    var maintHTML = maintList.length === 0 ? "" :
      '<h3 style="margin-top:18px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Out of service / maintenance</h3><div class="list">' +
      maintList.map(function (c) { return '<div class="listrow"><span class="cid">' + esc(c.id) + "</span>" + badge(effStatus(c)) + "</div>"; }).join("") + "</div>";

    v.innerHTML =
      '<div class="pagehead"><div><h2>Dashboard</h2><div class="sub">Snapshot of your fleet and money owed</div></div></div>' +
      '<div class="kpis">' +
        kpi("Fleet size", m.total, m.available + " available now", "#004812") +
        kpi("Utilization", m.util + "%", m.rented + " on rent", "#1f5fa8") +
        kpi("Monthly recurring", moneyWhole(m.mrr), "from active rentals", "#1f7a4d") +
        kpi("Outstanding", money(m.outstanding), m.overdue.length + " invoice(s) overdue", "#946610") +
        kpi("Overdue balance", money(m.overdueAmt), "past due date", "#b3382c") +
        kpi("Needs recurring setup", m.pendingRecurring, "see Billing → Add to recurring", "#946610") +
        kpi("Legacy AR", moneyWhole(m.collTotal), m.collCount + " account(s) — see Collections", "#946610") +
      "</div>" +
      '<div class="grid2">' +
        '<div class="panel" style="margin-bottom:0"><h3 style="text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-size:13px">Needs attention — overdue</h3>' + overdueHTML + "</div>" +
        '<div class="panel" style="margin-bottom:0"><h3 style="text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-size:13px">Fleet by type</h3><div class="list">' + byTypeHTML + "</div>" + maintHTML + "</div>" +
      "</div>";
  }

  /* ----------------------------- fleet ----------------------------- */
  function renderFleet(v) {
    v.innerHTML =
      '<div class="pagehead"><div><h2>Fleet<span class="count">' + state.containers.length + ' units</span></h2>' +
      '<div class="sub">Every container tracked, and where it stands</div></div>' +
      '<div style="display:flex;gap:8px">' +
      '<button class="btn" data-act="fleet-import">Import</button>' +
      '<button class="btn primary" data-act="fleet-add">+ Add container</button></div></div>' +
      '<div class="toolbar">' +
      '<div class="search"><input class="in" id="fleet-search" placeholder="Search ID, location, customer…" value="' + esc(ui.fleetQ) + '"></div>' +
      '<select class="in" id="fleet-type" style="width:auto"><option value="">All types</option>' + opt(TYPES, ui.fleetType) + "</select></div>" +
      '<div class="chips" style="margin-bottom:14px" id="fleet-chips">' +
      ["All", "Available", "Rented", "Maintenance", "Out of Service"].map(function (s) {
        return '<button class="chip ' + (ui.fleetFilter === s ? "on" : "") + '" data-act="fleet-filter" data-status="' + esc(s) + '">' + s + "</button>";
      }).join("") + "</div>" +
      '<div id="fleet-table"></div>' +
      '<div class="count" id="fleet-count" style="margin-top:8px"></div>';
    renderFleetTable();
  }

  function fleetList() {
    var term = ui.fleetQ.trim().toLowerCase();
    return state.containers.filter(function (c) {
      var s = effStatus(c);
      if (ui.fleetFilter !== "All" && s !== ui.fleetFilter) return false;
      if (ui.fleetType && c.type !== ui.fleetType) return false;
      if (!term) return true;
      var r = activeRentalOf(c.id);
      var cust = r ? customerName(r.customerId) : "";
      return [c.id, c.type, c.location, c.grade, cust].join(" ").toLowerCase().indexOf(term) !== -1;
    });
  }

  function renderFleetTable() {
    var list = fleetList();
    var rows = list.map(function (c) {
      var r = activeRentalOf(c.id);
      return "<tr>" +
        '<td class="cid">' + esc(c.id) + "</td>" +
        "<td>" + esc(c.type) + "</td>" +
        '<td class="muted">' + esc(c.grade) + "</td>" +
        "<td>" + (esc(c.location) || "—") + "</td>" +
        "<td>" + badge(effStatus(c)) + "</td>" +
        "<td>" + (r ? esc(customerName(r.customerId)) : '<span class="muted">—</span>') + "</td>" +
        '<td class="num">' + (r ? money(r.monthlyRate, 0) : "—") + "</td>" +
        '<td class="right nowrap">' +
        '<button class="btn sm ghost" data-act="fleet-edit" data-id="' + esc(c.id) + '">Edit</button>' +
        '<button class="btn sm ghost danger" data-act="fleet-del" data-id="' + esc(c.id) + '">Del</button></td></tr>';
    }).join("");
    if (!list.length) rows = '<tr><td colspan="8" class="empty-row">No containers match.</td></tr>';
    el("fleet-table").innerHTML =
      '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      "<th>Container ID</th><th>Type</th><th>Grade</th><th>Location</th><th>Status</th><th>Customer</th><th>Rate/mo</th><th></th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    el("fleet-count").textContent = "Showing " + list.length + " of " + state.containers.length;
  }

  function fleetModal(editing) {
    var f = editing || { id: "", type: TYPES[0], grade: GRADES[1], location: "", status: "Available" };
    var onRent = editing ? activeRentalOf(editing.id) : null;
    var statusField = onRent
      ? '<div class="muted" style="font-size:12.5px">On rent to ' + esc(customerName(onRent.customerId)) + ' — status stays “Rented” until the rental is ended.</div>'
      : '<div class="fld"><label>Status</label><select class="in" id="f-status">' + opt(MANUAL_STATUSES, f.status) + "</select></div>";
    openModal(editing ? "Edit container" : "Add container",
      '<div class="fld"><label>Container ID</label><input class="in mono" id="f-id" placeholder="REXU 1234567" value="' + esc(f.id) + '"></div>' +
      '<div class="row2"><div class="fld"><label>Type</label><select class="in" id="f-type">' + opt(TYPES, f.type) + "</select></div>" +
      '<div class="fld"><label>Grade</label><select class="in" id="f-grade">' + opt(GRADES, f.grade) + "</select></div></div>" +
      '<div class="fld"><label>Location / ship-to</label><input class="in" id="f-loc" placeholder="Yard A — Eugene" value="' + esc(f.location) + '"></div>' +
      statusField,
      '<button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" data-act="fleet-save" data-id="' + esc(editing ? editing.id : "") + '">' + (editing ? "Save changes" : "Add container") + "</button>");
  }

  function fleetSave(origId) {
    var id = el("f-id").value.trim();
    if (!id) return flash("Container ID is required");
    var dup = state.containers.some(function (c) { return c.id.toLowerCase() === id.toLowerCase() && c.id !== origId; });
    if (dup) return flash("That container ID already exists");
    var obj = {
      id: id, type: el("f-type").value, grade: el("f-grade").value,
      location: el("f-loc").value.trim(),
      status: el("f-status") ? el("f-status").value : (state.containers.find(function (c) { return c.id === origId; }) || {}).status || "Available",
      notes: (state.containers.find(function (c) { return c.id === origId; }) || {}).notes || ""
    };
    if (origId) state.containers = state.containers.map(function (c) { return c.id === origId ? obj : c; });
    else state.containers.unshift(obj);
    closeModal();
    flash(origId ? "Container updated" : "Container added");
    commit();
  }

  function fleetDel(id) {
    if (activeRentalOf(id)) return flash("End the active rental before deleting this unit");
    if (!confirm("Delete " + id + "?")) return;
    state.containers = state.containers.filter(function (c) { return c.id !== id; });
    flash("Container deleted");
    commit();
  }

  function fleetImportModal() {
    openModal("Import containers",
      '<div class="muted" style="font-size:12.5px">Paste one container per line: <span class="mono">ID, Type, Grade, Location</span>. Only ID is required; a header row is fine. Duplicate IDs are skipped.</div>' +
      '<textarea class="in mono" id="imp-text" rows="9" placeholder="REXU 1234567, 40&#39; Standard, Cargo-Worthy, Yard A — Eugene&#10;CASU 7654321, 20&#39; Standard, Wind &amp; Watertight, Yard B — Portland"></textarea>',
      '<button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" data-act="fleet-import-run">Import</button>');
  }

  function fleetImportRun() {
    var text = el("imp-text").value;
    var lines = text.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
    var existing = {};
    state.containers.forEach(function (c) { existing[c.id.toLowerCase()] = 1; });
    var added = [];
    lines.forEach(function (line, idx) {
      var cells = line.split(/[\t,]/).map(function (s) { return s.trim(); });
      if (idx === 0 && /^id\b/i.test(cells[0])) return;
      var id = cells[0], type = cells[1], grade = cells[2], location = cells[3];
      if (!id || existing[id.toLowerCase()]) return;
      existing[id.toLowerCase()] = 1;
      added.push({
        id: id, type: TYPES.indexOf(type) !== -1 ? type : "Other",
        grade: GRADES.indexOf(grade) !== -1 ? grade : GRADES[1],
        location: location || "", status: "Available", notes: ""
      });
    });
    if (!added.length) return flash("No new containers found to import");
    state.containers = added.concat(state.containers);
    closeModal();
    flash("Imported " + added.length + " container(s)");
    commit();
  }

  /* --------------------------- customers --------------------------- */
  function renderCustomers(v) {
    function activeCount(id) { return state.rentals.filter(function (r) { return r.customerId === id && !r.endDate; }).length; }
    var term = ui.custQ.trim().toLowerCase();
    var list = state.customers.filter(function (c) {
      if (!term) return true;
      return [c.name, c.accountNumber, c.email, c.phone].join(" ").toLowerCase().indexOf(term) !== -1;
    });
    var rows = list.map(function (c) {
      return "<tr>" +
        '<td style="font-weight:600">' + esc(c.name) + "</td>" +
        '<td class="mono">' + (esc(c.accountNumber) || "—") + "</td>" +
        "<td>" + (esc(c.contact) || "—") + "</td>" +
        '<td class="muted">' + (esc(c.email) || "—") + "</td>" +
        '<td class="num">' + (esc(c.phone) || "—") + "</td>" +
        '<td class="num">' + activeCount(c.id) + "</td>" +
        '<td class="right nowrap">' +
        '<button class="btn sm ghost" data-act="cust-edit" data-id="' + esc(c.id) + '">Edit</button>' +
        '<button class="btn sm ghost danger" data-act="cust-del" data-id="' + esc(c.id) + '">Del</button></td></tr>';
    }).join("");
    if (!list.length) rows = '<tr><td colspan="7" class="empty-row">No customers match.</td></tr>';
    v.innerHTML =
      '<div class="pagehead"><div><h2>Customers<span class="count">' + state.customers.length + '</span></h2><div class="sub">Who you rent to</div></div>' +
      '<button class="btn primary" data-act="cust-add">+ Add customer</button></div>' +
      '<div class="toolbar"><div class="search"><input class="in" id="cust-search" placeholder="Search name, account #, email…" value="' + esc(ui.custQ) + '"></div></div>' +
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Name</th><th>Account #</th><th>Contact</th><th>Email</th><th>Phone</th><th>Active rentals</th><th></th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
      '<div class="count" style="margin-top:8px">Showing ' + list.length + " of " + state.customers.length + "</div>";
  }

  function custModal(editing) {
    var c = editing || { name: "", accountNumber: "", contact: "", email: "", phone: "", billingAddress: "", notes: "" };
    openModal(editing ? "Edit customer" : "Add customer",
      '<div class="row2"><div class="fld"><label>Business / customer name</label><input class="in" id="c-name" value="' + esc(c.name) + '"></div>' +
      '<div class="fld"><label>Account #</label><input class="in mono" id="c-account" value="' + esc(c.accountNumber) + '"></div></div>' +
      '<div class="row2"><div class="fld"><label>Contact person</label><input class="in" id="c-contact" value="' + esc(c.contact) + '"></div>' +
      '<div class="fld"><label>Phone</label><input class="in" id="c-phone" value="' + esc(c.phone) + '"></div></div>' +
      '<div class="fld"><label>Email</label><input class="in" id="c-email" value="' + esc(c.email) + '"></div>' +
      '<div class="fld"><label>Billing address</label><input class="in" id="c-baddr" value="' + esc(c.billingAddress) + '"></div>' +
      '<div class="fld"><label>Notes</label><textarea class="in" id="c-notes" rows="2">' + esc(c.notes) + "</textarea></div>",
      '<button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" data-act="cust-save" data-id="' + esc(editing ? editing.id : "") + '">Save</button>');
  }

  function custSave(id) {
    var name = el("c-name").value.trim();
    if (!name) return flash("Customer name is required");
    var obj = {
      name: name, accountNumber: el("c-account").value.trim(), contact: el("c-contact").value.trim(),
      email: el("c-email").value.trim(), phone: el("c-phone").value.trim(),
      billingAddress: el("c-baddr").value.trim(), notes: el("c-notes").value.trim()
    };
    if (id) state.customers = state.customers.map(function (c) { return c.id === id ? Object.assign({}, c, obj) : c; });
    else { obj.id = uid(); state.customers.unshift(obj); }
    closeModal();
    flash(id ? "Customer updated" : "Customer added");
    commit();
  }

  function custDel(id) {
    var active = state.rentals.some(function (r) { return r.customerId === id && !r.endDate; });
    if (active) return flash("This customer has active rentals — end them first");
    var c = customerById(id);
    if (!confirm("Delete " + (c ? c.name : "customer") + "?")) return;
    state.customers = state.customers.filter(function (x) { return x.id !== id; });
    flash("Customer deleted");
    commit();
  }

  /* ---------------------------- rentals ---------------------------- */
  function renderRentals(v) {
    var activeN = state.rentals.filter(function (r) { return !r.endDate; }).length;
    var endedN = state.rentals.length - activeN;
    v.innerHTML =
      '<div class="pagehead"><div><h2>Rentals</h2><div class="sub">Active agreements drive availability and billing</div></div>' +
      '<button class="btn primary" data-act="rental-start">+ Start rental</button></div>' +
      '<div class="toolbar"><div class="search"><input class="in" id="rental-search" placeholder="Search container, customer, account #, PO, rental #…" value="' + esc(ui.rentalQ) + '"></div></div>' +
      '<div class="chips" style="margin-bottom:14px">' +
      '<button class="chip ' + (ui.rentalView === "active" ? "on" : "") + '" data-act="rental-view" data-view="active">Active (' + activeN + ")</button>" +
      '<button class="chip ' + (ui.rentalView === "ended" ? "on" : "") + '" data-act="rental-view" data-view="ended">Ended (' + endedN + ")</button></div>" +
      '<div id="rentals-table"></div>' +
      '<div class="count" id="rentals-count" style="margin-top:8px"></div>';
    renderRentalsTable();
  }

  function rentalsList() {
    var term = ui.rentalQ.trim().toLowerCase();
    return state.rentals.filter(function (r) { return ui.rentalView === "active" ? !r.endDate : r.endDate; })
      .filter(function (r) {
        if (!term) return true;
        var cust = customerById(r.customerId);
        var haystack = [
          containerLabel(r.containerId), cust ? cust.name : "", cust ? cust.accountNumber : "",
          r.poNumber, r.rentalNumber
        ].join(" ").toLowerCase();
        return haystack.indexOf(term) !== -1;
      })
      .sort(function (a, b) { return (b.startDate || "").localeCompare(a.startDate || ""); });
  }

  function renderRentalsTable() {
    var shown = rentalsList();
    var rows = shown.map(function (r) {
      var refs = [];
      if (r.rentalNumber) refs.push("Rental " + r.rentalNumber);
      if (r.poNumber) refs.push("PO " + r.poNumber);
      var recurBadge = "";
      if (!r.endDate) recurBadge = r.addedToRecurring ? badge("Yes") : badge("Pending");
      var endCell = r.endDate
        ? '<input class="in mono rental-end-input" type="date" data-id="' + esc(r.id) + '" value="' + esc(r.endDate) + '" style="min-width:150px">'
        : '<span class="badge b-rent">active</span>';
      return "<tr>" +
        '<td class="cid">' + esc(containerLabel(r.containerId)) + "</td>" +
        "<td>" + esc(customerName(r.customerId)) +
        (refs.length ? '<div class="subline mono">' + esc(refs.join(" · ")) + "</div>" : "") + "</td>" +
        '<td class="num">' + money(r.monthlyRate, 0) + "</td>" +
        '<td class="num muted">' + (r.serviceFee ? money(r.serviceFee, 0) : "—") + "</td>" +
        '<td class="num">' + r.startDate + "</td>" +
        '<td class="num">' + endCell + "</td>" +
        "<td>" + (recurBadge || "—") + "</td>" +
        '<td class="right nowrap">' +
        (!r.endDate ? '<button class="btn sm" data-act="rental-end" data-id="' + esc(r.id) + '">End rental</button>' : "") +
        "</td></tr>";
    }).join("");
    if (!shown.length) rows = '<tr><td colspan="8" class="empty-row">No ' + ui.rentalView + " rentals match.</td></tr>";
    el("rentals-table").innerHTML =
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Container</th><th>Customer</th><th>Rate/mo</th><th>Service fee</th><th>Start</th><th>' +
      (ui.rentalView === "active" ? "" : "End (editable)") + "</th><th>Recurring?</th><th></th></tr></thead><tbody>" + rows + "</tbody></table></div>";
    var countEl = el("rentals-count");
    if (countEl) countEl.textContent = "Showing " + shown.length + " of " + state.rentals.filter(function (r) { return ui.rentalView === "active" ? !r.endDate : r.endDate; }).length;
  }

  function rentalEndDateEdit(id, value) {
    if (!value) { flash("End date can't be blank — edit it instead of clearing it"); renderRentalsTable(); return; }
    var r = rentalById(id);
    if (!r) return;
    state.rentals = state.rentals.map(function (x) { return x.id === id ? Object.assign({}, x, { endDate: value }) : x; });
    persist();
    flash("Updated return date for " + containerLabel(r.containerId));
  }

  function rentalStartModal() {
    var avail = state.containers.filter(function (c) { return effStatus(c) === "Available"; });
    var contOpts = '<option value="">Select a container…</option>' + avail.map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(c.id) + " · " + esc(c.type) + "</option>";
    }).join("");
    var custOpts = '<option value="">Select a customer…</option>' + state.customers.map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(c.name) + (c.accountNumber ? " (" + esc(c.accountNumber) + ")" : "") + "</option>";
    }).join("");
    openModal("Start a rental",
      '<div class="fld"><label>Container (' + avail.length + ' available)</label><select class="in mono" id="r-cont">' + contOpts + "</select></div>" +
      (avail.length === 0 ? '<div class="muted" style="font-size:12.5px">No available containers — everything is on rent or out of service.</div>' : "") +
      '<div class="fld"><label>Customer</label><select class="in" id="r-cust">' + custOpts + "</select></div>" +
      '<div class="row2"><div class="fld"><label>Monthly rate ($)</label><input class="in mono" id="r-rate" type="number" min="0"></div>' +
      '<div class="fld"><label>Service fee ($)</label><input class="in mono" id="r-fee" type="number" min="0" placeholder="0"></div></div>' +
      '<div class="row2"><div class="fld"><label>PO number (optional)</label><input class="in" id="r-po"></div>' +
      '<div class="fld"><label>Rental # (optional)</label><input class="in" id="r-rentalnum"></div></div>' +
      '<div class="fld"><label>Start date</label><input class="in" id="r-start" type="date" value="' + today() + '"></div>' +
      '<div class="muted" style="font-size:12px">Service fee is charged once on delivery and again on pickup. This new rental will show up in Billing → "New this month" so you can generate its first prorated invoice.</div>',
      '<button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" data-act="rental-create">Start rental</button>');
  }

  function rentalCreate() {
    var cont = el("r-cont").value, cust = el("r-cust").value, rate = Number(el("r-rate").value);
    if (!cont) return flash("Pick a container");
    if (!cust) return flash("Pick a customer");
    if (!(rate > 0)) return flash("Enter a monthly rate");
    state.rentals.unshift({
      id: uid(), containerId: cont, customerId: cust, monthlyRate: rate,
      startDate: el("r-start").value || today(), endDate: null,
      serviceFee: Number(el("r-fee").value) || 0,
      poNumber: el("r-po").value.trim(), rentalNumber: el("r-rentalnum").value.trim(),
      shipToAddress: "", driver: "", notes: "", addedToRecurring: false
    });
    closeModal();
    flash("Rental started");
    commit();
  }

  function rentalEndModal(id) {
    var r = rentalById(id);
    if (!r) return;
    openModal("End rental",
      "<div>End the rental for <span class=\"cid\">" + esc(containerLabel(r.containerId)) + "</span> with " + esc(customerName(r.customerId)) + ". The container returns to available.</div>" +
      '<div class="fld"><label>End date</label><input class="in" id="r-end" type="date" value="' + today() + '"></div>',
      '<button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" data-act="rental-end-confirm" data-id="' + esc(id) + '">End rental</button>');
  }

  function rentalEndConfirm(id) {
    var end = el("r-end").value || today();
    state.rentals = state.rentals.map(function (r) { return r.id === id ? Object.assign({}, r, { endDate: end }) : r; });
    closeModal();
    flash("Rental ended — container freed. It'll show up in Billing → \"Returned this month\" for the credit + pickup invoice.");
    commit();
  }

  function toggleAddedToRecurring(id) {
    state.rentals = state.rentals.map(function (r) { return r.id === id ? Object.assign({}, r, { addedToRecurring: !r.addedToRecurring }) : r; });
    persist();
    render();
  }

  /* ---------------------------- billing ---------------------------- */
  function invoiceExists(rentalId, kind, ym) {
    return state.invoices.some(function (i) { return i.rentalId === rentalId && i.kind === kind && (ym == null || i.periodMonth === ym); });
  }
  function nextInvoiceNumber() { return "INV-" + String(state.invoices.length + 1).padStart(5, "0"); }
  function invoiceMeta(r) {
    var cust = customerById(r.customerId);
    return { accountNumber: cust ? cust.accountNumber : "", poNumber: r.poNumber || "", rentalNumber: r.rentalNumber || "" };
  }

  // Stage 1: new rentals this month (by delivery/start date)
  function newRentalsForMonth(ym) {
    return state.rentals.filter(function (r) { return monthKey(r.startDate) === ym; });
  }
  function generateNewRentalInvoice(rentalId) {
    var r = rentalById(rentalId);
    if (!r) return;
    var ym = monthKey(r.startDate);
    if (invoiceExists(rentalId, "initial", null)) return flash("First invoice already generated for this rental");
    var prorate = nextMonthProrate(r.monthlyRate, r.startDate);
    var amount = round2((Number(r.serviceFee) || 0) + (Number(r.monthlyRate) || 0) + prorate);
    var meta = invoiceMeta(r);
    state.invoices.push({
      id: uid(), number: nextInvoiceNumber(), kind: "initial", rentalId: r.id, containerId: r.containerId, customerId: r.customerId,
      accountNumber: meta.accountNumber, poNumber: meta.poNumber, rentalNumber: meta.rentalNumber,
      periodMonth: ym, serviceFee: r.serviceFee || 0, baseRate: r.monthlyRate, prorate: prorate,
      amount: amount, issueDate: today(), dueDate: today(), status: "unpaid", paidDate: null
    });
    flash("Generated first invoice — " + money(amount) + " for " + customerName(r.customerId));
    commit();
  }
  function generateAllNewRentalInvoices(ym) {
    var list = newRentalsForMonth(ym).filter(function (r) { return !invoiceExists(r.id, "initial", null); });
    if (!list.length) return flash("Nothing new to invoice for " + monthLabel(ym));
    list.forEach(function (r) {
      var prorate = nextMonthProrate(r.monthlyRate, r.startDate);
      var amount = round2((Number(r.serviceFee) || 0) + (Number(r.monthlyRate) || 0) + prorate);
      var meta = invoiceMeta(r);
      state.invoices.push({
        id: uid(), number: nextInvoiceNumber(), kind: "initial", rentalId: r.id, containerId: r.containerId, customerId: r.customerId,
        accountNumber: meta.accountNumber, poNumber: meta.poNumber, rentalNumber: meta.rentalNumber,
        periodMonth: ym, serviceFee: r.serviceFee || 0, baseRate: r.monthlyRate, prorate: prorate,
        amount: amount, issueDate: today(), dueDate: today(), status: "unpaid", paidDate: null
      });
    });
    flash("Generated " + list.length + " first invoice(s) for " + monthLabel(ym));
    commit();
  }

  function toggleNewRentalInvoice(rentalId) {
    var existing = state.invoices.find(function (i) { return i.rentalId === rentalId && i.kind === "initial"; });
    if (existing) {
      if (existing.status === "paid") return flash("That invoice is marked paid — unmark it first, then you can undo it.");
      state.invoices = state.invoices.filter(function (i) { return i.id !== existing.id; });
      var r0 = rentalById(rentalId);
      flash("Undid the first invoice" + (r0 ? " for " + customerName(r0.customerId) : ""));
      commit();
    } else {
      generateNewRentalInvoice(rentalId);
    }
  }
  function returnsForMonth(ym) {
    return state.rentals.filter(function (r) { return r.endDate && monthKey(r.endDate) === ym; });
  }
  function generateReturnInvoices(rentalId) {
    var r = rentalById(rentalId);
    if (!r || !r.endDate) return;
    if (invoiceExists(rentalId, "credit", null)) return flash("Return already processed for this rental");
    var credit = returnProrateCredit(r.monthlyRate, r.endDate);
    var meta = invoiceMeta(r);
    var ym = monthKey(r.endDate);
    state.invoices.push({
      id: uid(), number: nextInvoiceNumber(), kind: "credit", rentalId: r.id, containerId: r.containerId, customerId: r.customerId,
      accountNumber: meta.accountNumber, poNumber: meta.poNumber, rentalNumber: meta.rentalNumber,
      periodMonth: ym, baseRate: r.monthlyRate, amount: -credit, issueDate: today(), dueDate: today(), status: "applied", paidDate: null
    });
    if (Number(r.serviceFee) > 0) {
      state.invoices.push({
        id: uid(), number: nextInvoiceNumber(), kind: "pickup", rentalId: r.id, containerId: r.containerId, customerId: r.customerId,
        accountNumber: meta.accountNumber, poNumber: meta.poNumber, rentalNumber: meta.rentalNumber,
        periodMonth: ym, amount: Number(r.serviceFee), issueDate: today(), dueDate: today(), status: "unpaid", paidDate: null
      });
    }
    flash("Recorded return credit (" + money(credit) + ") and pickup invoice for " + customerName(r.customerId));
    commit();
  }
  function generateAllReturnInvoices(ym) {
    var list = returnsForMonth(ym).filter(function (r) { return !invoiceExists(r.id, "credit", null); });
    if (!list.length) return flash("Nothing to process for returns in " + monthLabel(ym));
    list.forEach(function (r) { generateReturnInvoicesQuiet(r); });
    flash("Processed " + list.length + " return(s) for " + monthLabel(ym));
    commit();
  }
  function generateReturnInvoicesQuiet(r) {
    var credit = returnProrateCredit(r.monthlyRate, r.endDate);
    var meta = invoiceMeta(r);
    var ym = monthKey(r.endDate);
    state.invoices.push({
      id: uid(), number: nextInvoiceNumber(), kind: "credit", rentalId: r.id, containerId: r.containerId, customerId: r.customerId,
      accountNumber: meta.accountNumber, poNumber: meta.poNumber, rentalNumber: meta.rentalNumber,
      periodMonth: ym, baseRate: r.monthlyRate, amount: -credit, issueDate: today(), dueDate: today(), status: "applied", paidDate: null
    });
    if (Number(r.serviceFee) > 0) {
      state.invoices.push({
        id: uid(), number: nextInvoiceNumber(), kind: "pickup", rentalId: r.id, containerId: r.containerId, customerId: r.customerId,
        accountNumber: meta.accountNumber, poNumber: meta.poNumber, rentalNumber: meta.rentalNumber,
        periodMonth: ym, amount: Number(r.serviceFee), issueDate: today(), dueDate: today(), status: "unpaid", paidDate: null
      });
    }
  }

  function toggleReturnInvoices(rentalId) {
    var existing = state.invoices.filter(function (i) { return i.rentalId === rentalId && (i.kind === "credit" || i.kind === "pickup"); });
    if (existing.length) {
      var anyPaid = existing.some(function (i) { return i.status === "paid"; });
      if (anyPaid) return flash("The pickup invoice is marked paid — unmark it first, then you can undo the return.");
      var ids = existing.map(function (i) { return i.id; });
      state.invoices = state.invoices.filter(function (i) { return ids.indexOf(i.id) === -1; });
      var r0 = rentalById(rentalId);
      flash("Undid the return credit/pickup" + (r0 ? " for " + customerName(r0.customerId) : ""));
      commit();
    } else {
      generateReturnInvoices(rentalId);
    }
  }

  // Stage 4: recurring roster — flat monthly invoice for rentals already flagged addedToRecurring
  function recurringRoster() { return state.rentals.filter(function (r) { return !r.endDate && r.addedToRecurring; }); }
  function generateRecurringForMonth(ym) {
    var list = recurringRoster().filter(function (r) { return monthKey(r.startDate) <= ym; });
    var created = 0;
    list.forEach(function (r) {
      if (invoiceExists(r.id, "recurring", ym)) return;
      var meta = invoiceMeta(r);
      state.invoices.push({
        id: uid(), number: nextInvoiceNumber(), kind: "recurring", rentalId: r.id, containerId: r.containerId, customerId: r.customerId,
        accountNumber: meta.accountNumber, poNumber: meta.poNumber, rentalNumber: meta.rentalNumber,
        periodMonth: ym, baseRate: r.monthlyRate, amount: Number(r.monthlyRate) || 0,
        issueDate: ym + "-01", dueDate: ym + "-15", status: "unpaid", paidDate: null
      });
      created++;
    });
    if (!created) return flash("Recurring roster already billed for " + monthLabel(ym));
    flash("Generated " + created + " recurring invoice(s) for " + monthLabel(ym));
    commit();
  }

  function toggleRecurringInvoice(rentalId, ym) {
    var existing = state.invoices.find(function (i) { return i.rentalId === rentalId && i.kind === "recurring" && i.periodMonth === ym; });
    if (existing) {
      if (existing.status === "paid") return flash("That invoice is marked paid — unmark it first, then you can undo it.");
      state.invoices = state.invoices.filter(function (i) { return i.id !== existing.id; });
      var r0 = rentalById(rentalId);
      flash("Undid the " + monthLabel(ym) + " recurring invoice" + (r0 ? " for " + customerName(r0.customerId) : ""));
      commit();
    } else {
      var r = rentalById(rentalId);
      if (!r) return;
      var meta = invoiceMeta(r);
      state.invoices.push({
        id: uid(), number: nextInvoiceNumber(), kind: "recurring", rentalId: r.id, containerId: r.containerId, customerId: r.customerId,
        accountNumber: meta.accountNumber, poNumber: meta.poNumber, rentalNumber: meta.rentalNumber,
        periodMonth: ym, baseRate: r.monthlyRate, amount: Number(r.monthlyRate) || 0,
        issueDate: ym + "-01", dueDate: ym + "-15", status: "unpaid", paidDate: null
      });
      flash("Generated recurring invoice for " + customerName(r.customerId));
      commit();
    }
  }

  function billingTogglePaid(id) {
    state.invoices = state.invoices.map(function (i) {
      if (i.id !== id) return i;
      var paid = i.status === "paid";
      return Object.assign({}, i, { status: paid ? "unpaid" : "paid", paidDate: paid ? null : today() });
    });
    commit();
  }

  function kindLabel(k) {
    return { initial: "First invoice", credit: "Return credit", pickup: "Pickup fee", recurring: "Recurring" }[k] || k;
  }

  function renderBilling(v) {
    var ym = ui.billMonth;
    var newList = newRentalsForMonth(ym);
    var retList = returnsForMonth(ym);
    var pendingList = state.rentals.filter(needsRecurringFlag)
      .sort(function (a, b) { return a.startDate.localeCompare(b.startDate); });
    var roster = recurringRoster();

    /* Stage 1: new rentals */
    var newRows = newList.map(function (r) {
      var existingInv = state.invoices.find(function (i) { return i.rentalId === r.id && i.kind === "initial"; });
      var prorate = nextMonthProrate(r.monthlyRate, r.startDate);
      var total = round2((Number(r.serviceFee) || 0) + (Number(r.monthlyRate) || 0) + prorate);
      var actionBtn = existingInv
        ? '<button class="btn sm ' + (existingInv.status === "paid" ? "ghost" : "danger") + '" data-act="bill-new-toggle" data-id="' + esc(r.id) + '">' + (existingInv.status === "paid" ? "Paid — locked" : "Undo") + "</button>"
        : '<button class="btn sm primary" data-act="bill-new-toggle" data-id="' + esc(r.id) + '">Generate</button>';
      return "<tr>" +
        '<td class="cid">' + esc(containerLabel(r.containerId)) + "</td>" +
        "<td>" + esc(customerName(r.customerId)) + "</td>" +
        '<td class="num">' + r.startDate + "</td>" +
        '<td class="num">' + money(r.serviceFee || 0, 0) + "</td>" +
        '<td class="num">' + money(r.monthlyRate, 0) + "</td>" +
        '<td class="num">' + money(prorate) + "</td>" +
        '<td class="num money">' + money(total) + "</td>" +
        "<td>" + actionBtn + "</td></tr>";
    }).join("");
    if (!newList.length) newRows = '<tr><td colspan="8" class="empty-row">No new rentals delivered in ' + monthLabel(ym) + ".</td></tr>";

    /* Stage 2: returns */
    var retRows = retList.map(function (r) {
      var existingInvs = state.invoices.filter(function (i) { return i.rentalId === r.id && (i.kind === "credit" || i.kind === "pickup"); });
      var anyPaid = existingInvs.some(function (i) { return i.status === "paid"; });
      var credit = returnProrateCredit(r.monthlyRate, r.endDate);
      var actionBtn = existingInvs.length
        ? '<button class="btn sm ' + (anyPaid ? "ghost" : "danger") + '" data-act="bill-return-toggle" data-id="' + esc(r.id) + '">' + (anyPaid ? "Paid — locked" : "Undo") + "</button>"
        : '<button class="btn sm primary" data-act="bill-return-toggle" data-id="' + esc(r.id) + '">Generate</button>';
      return "<tr>" +
        '<td class="cid">' + esc(containerLabel(r.containerId)) + "</td>" +
        "<td>" + esc(customerName(r.customerId)) + "</td>" +
        '<td class="num">' + r.endDate + "</td>" +
        '<td class="num" style="color:var(--credit)">-' + money(credit) + "</td>" +
        '<td class="num">' + money(r.serviceFee || 0, 0) + "</td>" +
        "<td>" + actionBtn + "</td></tr>";
    }).join("");
    if (!retList.length) retRows = '<tr><td colspan="6" class="empty-row">No returns recorded in ' + monthLabel(ym) + ".</td></tr>";

    /* Stage 3: needs recurring */
    var pendingRows = pendingList.map(function (r) {
      var elapsed = monthsElapsedCalendar(r.startDate, today());
      return "<tr>" +
        '<td class="cid">' + esc(containerLabel(r.containerId)) + "</td>" +
        "<td>" + esc(customerName(r.customerId)) + "</td>" +
        '<td class="num">' + r.startDate + "</td>" +
        '<td class="num">' + elapsed + " mo</td>" +
        '<td class="num">' + money(r.monthlyRate, 0) + "</td>" +
        '<td class="right"><button class="btn sm primary" data-act="bill-mark-recurring" data-id="' + esc(r.id) + '">Mark added to recurring</button></td></tr>';
    }).join("");
    if (!pendingList.length) pendingRows = '<tr><td colspan="5" class="empty-row">Nothing waiting — everything eligible is already on the recurring system.</td></tr>';

    /* Stage 4: roster */
    var rosterRows = roster.slice(0, 12).map(function (r) {
      var existingInv = state.invoices.find(function (i) { return i.rentalId === r.id && i.kind === "recurring" && i.periodMonth === ym; });
      var actionBtn = existingInv
        ? '<button class="btn sm ' + (existingInv.status === "paid" ? "ghost" : "danger") + '" data-act="bill-recurring-toggle" data-id="' + esc(r.id) + '">' + (existingInv.status === "paid" ? "Paid — locked" : "Undo") + "</button>"
        : '<button class="btn sm primary" data-act="bill-recurring-toggle" data-id="' + esc(r.id) + '">Bill</button>';
      return "<tr>" +
        '<td class="cid">' + esc(containerLabel(r.containerId)) + "</td>" +
        "<td>" + esc(customerName(r.customerId)) + "</td>" +
        '<td class="num">' + money(r.monthlyRate, 0) + "</td>" +
        '<td class="right">' + actionBtn + "</td></tr>";
    }).join("");
    if (!roster.length) rosterRows = '<tr><td colspan="4" class="empty-row">No rentals are flagged as on-recurring yet.</td></tr>';

    /* Ledger */
    var months = {};
    state.invoices.forEach(function (i) { months[i.periodMonth] = 1; });
    var ledger = state.invoices.filter(function (i) {
      if (ui.billLedgerStatus === "all") return true;
      if (ui.billLedgerStatus === "overdue") return isOverdue(i);
      if (ui.billLedgerStatus === "paid") return i.status === "paid";
      if (ui.billLedgerStatus === "unpaid") return i.status === "unpaid" && !isOverdue(i);
      if (ui.billLedgerStatus === "credit") return i.status === "applied";
      return true;
    }).sort(function (a, b) { return b.issueDate.localeCompare(a.issueDate) || b.number.localeCompare(a.number); });

    var ledgerRows = ledger.slice(0, 200).map(function (i) {
      var refs = [];
      if (i.accountNumber) refs.push("Acct " + i.accountNumber);
      if (i.poNumber) refs.push("PO " + i.poNumber);
      if (i.rentalNumber) refs.push("Rental " + i.rentalNumber);
      var statusBadge = i.status === "applied" ? badge("Credit") : (i.status === "paid" ? badge("Paid") : badge("Unpaid", isOverdue(i)));
      var amtColor = i.amount < 0 ? "var(--credit)" : "var(--ink)";
      return "<tr>" +
        '<td class="cid">' + esc(i.number) + (refs.length ? '<div class="subline mono">' + esc(refs.join(" · ")) + "</div>" : "") + "</td>" +
        "<td>" + esc(customerName(i.customerId)) + "</td>" +
        '<td class="cid">' + esc(containerLabel(i.containerId)) + "</td>" +
        "<td>" + kindLabel(i.kind) + "</td>" +
        '<td class="num">' + monthLabel(i.periodMonth) + "</td>" +
        '<td class="num money" style="color:' + amtColor + '">' + money(i.amount) + "</td>" +
        "<td>" + statusBadge + "</td>" +
        '<td class="right">' + (i.status === "applied" ? "" :
          '<button class="btn sm ' + (i.status === "paid" ? "ghost" : "primary") + '" data-act="bill-toggle" data-id="' + esc(i.id) + '">' + (i.status === "paid" ? "Unmark" : "Mark paid") + "</button>") + "</td></tr>";
    }).join("");
    if (!ledger.length) ledgerRows = '<tr><td colspan="8" class="empty-row">No invoices generated yet.</td></tr>';

    var monthOptions = Object.keys(months).concat([ym]).filter(function (v2, idx, arr) { return arr.indexOf(v2) === idx; })
      .sort().reverse().map(function (m) {
        return '<option value="' + m + '"' + (m === ym ? " selected" : "") + ">" + monthLabel(m) + "</option>";
      }).join("");

    v.innerHTML =
      '<div class="pagehead"><div><h2>Billing</h2><div class="sub">The same four steps as your monthly close — new rentals, returns, recurring setup, and the standing roster</div></div>' +
      '<div class="fld" style="min-width:180px"><label>Closing month</label><input class="in" id="bill-month" type="month" value="' + ym + '"></div></div>' +

      '<div class="panel"><div class="panel-head"><div><h3><span class="stage-badge">1</span>&nbsp; New rentals — ' + monthLabel(ym) + '</h3><p class="panel-sub">First invoice = service fee + full month + proration to the next calendar boundary.</p></div>' +
      (newList.some(function(r){return !invoiceExists(r.id,"initial",null);}) ? '<button class="btn primary sm" data-act="bill-new-all">Generate all</button>' : "") + "</div>" +
      '<div class="formula" style="margin-bottom:10px">proration = (monthly rate ÷ days in ' + monthLabel(ym) + ') × (days in month − delivery day)</div>' +
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Container</th><th>Customer</th><th>Delivered</th><th>Service fee</th><th>Month</th><th>Proration</th><th>Total</th><th></th></tr></thead><tbody>' + newRows + "</tbody></table></div></div>" +

      '<div class="panel"><div class="panel-head"><div><h3><span class="stage-badge">2</span>&nbsp; Returns — ' + monthLabel(ym) + '</h3><p class="panel-sub">Credits back the unused prorated days already auto-billed, then invoices the pickup fee separately.</p></div>' +
      (retList.some(function(r){return !invoiceExists(r.id,"credit",null);}) ? '<button class="btn primary sm" data-act="bill-return-all">Generate all</button>' : "") + "</div>" +
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Container</th><th>Customer</th><th>Returned</th><th>Credit</th><th>Pickup fee</th><th></th></tr></thead><tbody>' + retRows + "</tbody></table></div></div>" +

      '<div class="panel"><h3><span class="stage-badge">3</span>&nbsp; Needs to be added to recurring</h3>' +
      '<p class="panel-sub">Active rentals older than ' + RECURRING_THRESHOLD_MONTHS + ' months that aren\'t flagged as on the accounting system\'s auto-bill yet. Not tied to the month above — this is a live queue.</p>' +
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Container</th><th>Customer</th><th>Delivered</th><th>Age</th><th>Rate/mo</th><th></th></tr></thead><tbody>' + pendingRows + "</tbody></table></div></div>" +

      '<div class="panel"><div class="panel-head"><div><h3><span class="stage-badge">4</span>&nbsp; Recurring roster</h3><p class="panel-sub">' + roster.length + ' rentals on the accounting system\'s auto-bill. Generates a flat monthly invoice per unit for ' + monthLabel(ym) + '.</p></div>' +
      '<button class="btn primary sm" data-act="bill-recurring-generate">Generate recurring invoices</button></div>' +
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Container</th><th>Customer</th><th>Rate/mo</th><th></th></tr></thead><tbody>' + rosterRows + "</tbody></table></div>" +
      (roster.length > 12 ? '<div class="count" style="margin-top:8px">Showing 12 of ' + roster.length + "</div>" : "") + "</div>" +

      '<div class="panel"><h3>Invoice ledger</h3><p class="panel-sub">Everything generated above, in one list — this is what gets keyed into your accounting software.</p>' +
      '<div class="chips" style="margin-bottom:12px">' +
      ["all", "unpaid", "overdue", "paid", "credit"].map(function (s) {
        return '<button class="chip ' + (ui.billLedgerStatus === s ? "on" : "") + '" data-act="bill-ledger-status" data-status="' + s + '">' + s.charAt(0).toUpperCase() + s.slice(1) + "</button>";
      }).join("") + "</div>" +
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Invoice</th><th>Customer</th><th>Container</th><th>Type</th><th>Period</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>' + ledgerRows + "</tbody></table></div>" +
      (ledger.length > 200 ? '<div class="count" style="margin-top:8px">Showing 200 of ' + ledger.length + "</div>" : "") + "</div>";

    var mSel = el("bill-month");
    if (mSel && monthOptions.indexOf('value="' + ym + '"') === -1) { /* no-op, native input type=month used instead */ }
  }

  /* --------------------------- collections --------------------------- */
  function renderCollections(v) {
    var term = ui.collQ.trim().toLowerCase();
    var closedStages = ["Resolved", "Written Off", "Closed"];
    var list = state.collections.filter(function (c) {
      if (ui.collStageFilter === "open" && closedStages.indexOf(c.stage) !== -1) return false;
      if (ui.collStageFilter === "closed" && closedStages.indexOf(c.stage) === -1) return false;
      if (!term) return true;
      return [c.name, c.account, c.status, c.stage, c.phone, c.email, c.address].join(" ").toLowerCase().indexOf(term) !== -1;
    });
    list = list.slice().sort(function (a, b) { return (Number(b.balance) || 0) - (Number(a.balance) || 0); });
    var total = list.reduce(function (s, c) { return s + (Number(c.balance) || 0); }, 0);
    var openCount = state.collections.filter(function (c) { return closedStages.indexOf(c.stage) === -1; }).length;
    var closedCount = state.collections.length - openCount;

    var rows = list.map(function (c) {
      var noteCount = (c.notes || []).length;
      var lastNote = noteCount ? c.notes[noteCount - 1] : null;
      return "<tr>" +
        '<td style="font-weight:600">' + esc(c.name) + '<div class="subline mono">' + esc(c.account) + "</div></td>" +
        '<td class="num money" style="color:var(--danger)">' + money(c.balance) + "</td>" +
        '<td><select class="in coll-stage-select" data-id="' + esc(c.account) + '" style="min-width:170px">' + opt(COLLECTION_STAGES, c.stage || "New") + "</select></td>" +
        '<td class="muted" style="max-width:240px">' + (lastNote ? esc(lastNote.text) + '<div class="subline">' + lastNote.date + "</div>" : "—") + "</td>" +
        '<td class="num">' + (esc(c.phone) || "—") + "</td>" +
        '<td class="right nowrap"><button class="btn sm ghost" data-act="coll-notes" data-id="' + esc(c.account) + '">Notes (' + noteCount + ")</button></td>" +
        "</tr>";
    }).join("");
    if (!list.length) rows = '<tr><td colspan="6" class="empty-row">No accounts match.</td></tr>';

    v.innerHTML =
      '<div class="pagehead"><div><h2>Collections</h2><div class="sub">Legacy accounts receivable, with a working status flow and notes</div></div></div>' +
      '<div class="banner">These balances came from the old delinquent-accounts sheet, not from invoices generated in this tool. They don\'t affect the Billing tab\'s totals — use this list for collections follow-up and to true-up your accounting software.</div>' +
      '<div class="kpis">' +
      '<div class="kpi" style="--accent:#b3382c"><div class="lbl">Accounts shown</div><div class="val">' + list.length + "</div></div>" +
      '<div class="kpi" style="--accent:#b3382c"><div class="lbl">Total balance shown</div><div class="val">' + moneyWhole(total) + "</div></div></div>" +
      '<div class="toolbar"><div class="search"><input class="in" id="coll-search" placeholder="Search name, account #, stage…" value="' + esc(ui.collQ) + '"></div></div>' +
      '<div class="chips" style="margin-bottom:14px">' +
      '<button class="chip ' + (ui.collStageFilter === "open" ? "on" : "") + '" data-act="coll-filter" data-filter="open">Open (' + openCount + ")</button>" +
      '<button class="chip ' + (ui.collStageFilter === "closed" ? "on" : "") + '" data-act="coll-filter" data-filter="closed">Resolved / Written off / Closed (' + closedCount + ")</button>" +
      '<button class="chip ' + (ui.collStageFilter === "all" ? "on" : "") + '" data-act="coll-filter" data-filter="all">All (' + state.collections.length + ")</button></div>" +
      '<div class="tablewrap"><table class="tbl"><thead><tr><th>Customer</th><th>Balance</th><th>Stage</th><th>Latest note</th><th>Phone</th><th></th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
      '<div class="count" style="margin-top:8px">Showing ' + list.length + " of " + state.collections.length + "</div>";
  }

  function collectionNotesModal(accountId) {
    var c = collectionById(accountId);
    if (!c) return;
    var notes = (c.notes || []).slice().reverse();
    var notesHTML = notes.length
      ? '<div class="list">' + notes.map(function (n) {
          return '<div class="listrow" style="align-items:flex-start"><div><div>' + esc(n.text) + '</div><div class="subline mono">' + n.date + "</div></div></div>";
        }).join("") + "</div>"
      : '<p class="muted" style="margin:0">No notes yet.</p>';
    openModal(esc(c.name) + " — notes",
      '<div class="muted" style="font-size:12.5px">Account ' + esc(c.account) + " · Balance " + money(c.balance) + " · Stage: " + esc(c.stage || "New") + "</div>" +
      '<div class="fld"><label>Add a note</label><textarea class="in" id="coll-note-text" rows="3" placeholder="Left voicemail, promised payment by Friday…"></textarea></div>' +
      '<div class="fld"><label>History</label>' + notesHTML + "</div>",
      '<button class="btn" data-act="modal-close">Close</button>' +
      '<button class="btn primary" data-act="coll-note-add" data-id="' + esc(accountId) + '">Add note</button>');
  }

  function collectionById(id) {
    for (var i = 0; i < state.collections.length; i++) if (state.collections[i].account === id) return state.collections[i];
    return null;
  }
  function setCollectionStage(accountId, stage) {
    state.collections = state.collections.map(function (c) { return c.account === accountId ? Object.assign({}, c, { stage: stage }) : c; });
    persist();
    flash("Stage set to \u201c" + stage + "\u201d");
  }
  function addCollectionNote(accountId, text) {
    if (!text || !text.trim()) return flash("Write something before adding the note");
    state.collections = state.collections.map(function (c) {
      if (c.account !== accountId) return c;
      var notes = (c.notes || []).concat([{ id: uid(), date: today(), text: text.trim() }]);
      return Object.assign({}, c, { notes: notes });
    });
    persist();
  }

  /* --------------------------- modals --------------------------- */
  function openModal(title, body, foot) {
    el("overlay-root").innerHTML =
      '<div class="overlay" data-act="overlay"><div class="modal" id="modal-inner">' +
      '<div class="modal-head"><h3>' + title + '</h3><button class="x" data-act="modal-close" aria-label="Close">×</button></div>' +
      '<div class="modal-body">' + body + "</div>" +
      '<div class="modal-foot">' + foot + "</div></div></div>";
  }
  function closeModal() { el("overlay-root").innerHTML = ""; }

  /* --------------------------- dispatch --------------------------- */
  var CLICK = {
    "tab": function (t) { ui.tab = t.getAttribute("data-tab"); closeModal(); render(); },
    "load-sample": loadRealData,
    "reset-all": resetAll,
    "modal-close": closeModal,
    "overlay": function (t, e) { if (e.target.classList.contains("overlay")) closeModal(); },
    "fleet-add": function () { fleetModal(null); },
    "fleet-edit": function (t) { fleetModal(state.containers.find(function (c) { return c.id === t.getAttribute("data-id"); })); },
    "fleet-del": function (t) { fleetDel(t.getAttribute("data-id")); },
    "fleet-save": function (t) { fleetSave(t.getAttribute("data-id")); },
    "fleet-import": fleetImportModal,
    "fleet-import-run": fleetImportRun,
    "fleet-filter": function (t) { ui.fleetFilter = t.getAttribute("data-status"); render(); },
    "cust-add": function () { custModal(null); },
    "cust-edit": function (t) { custModal(customerById(t.getAttribute("data-id"))); },
    "cust-del": function (t) { custDel(t.getAttribute("data-id")); },
    "cust-save": function (t) { custSave(t.getAttribute("data-id")); },
    "rental-start": rentalStartModal,
    "rental-create": rentalCreate,
    "rental-end": function (t) { rentalEndModal(t.getAttribute("data-id")); },
    "rental-end-confirm": function (t) { rentalEndConfirm(t.getAttribute("data-id")); },
    "rental-view": function (t) { ui.rentalView = t.getAttribute("data-view"); render(); },
    "bill-new-toggle": function (t) { toggleNewRentalInvoice(t.getAttribute("data-id")); },
    "bill-new-all": function () { generateAllNewRentalInvoices(ui.billMonth); },
    "bill-return-toggle": function (t) { toggleReturnInvoices(t.getAttribute("data-id")); },
    "bill-return-all": function () { generateAllReturnInvoices(ui.billMonth); },
    "bill-mark-recurring": function (t) { toggleAddedToRecurring(t.getAttribute("data-id")); flash("Marked as added to recurring"); },
    "bill-recurring-toggle": function (t) { toggleRecurringInvoice(t.getAttribute("data-id"), ui.billMonth); },
    "bill-recurring-generate": function () { generateRecurringForMonth(ui.billMonth); },
    "bill-toggle": function (t) { billingTogglePaid(t.getAttribute("data-id")); },
    "bill-ledger-status": function (t) { ui.billLedgerStatus = t.getAttribute("data-status"); render(); },
    "coll-filter": function (t) { ui.collStageFilter = t.getAttribute("data-filter"); render(); },
    "coll-notes": function (t) { collectionNotesModal(t.getAttribute("data-id")); },
    "coll-note-add": function (t) {
      var id = t.getAttribute("data-id");
      addCollectionNote(id, el("coll-note-text").value);
      renderCollections(el("view"));
      collectionNotesModal(id);
    },
    "auth-signin": function () { doSignIn(); },
    "auth-signout": function () { doSignOut(); }
  };

  document.addEventListener("click", function (e) {
    var node = e.target.closest("[data-act]");
    if (!node) return;
    var act = node.getAttribute("data-act");
    if (CLICK[act]) { e.preventDefault(); CLICK[act](node, e); }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "fleet-search") { ui.fleetQ = e.target.value; renderFleetTable(); }
    else if (e.target.id === "rental-search") { ui.rentalQ = e.target.value; renderRentalsTable(); }
    else if (e.target.id === "cust-search") { ui.custQ = e.target.value; renderCustomers(el("view")); }
    else if (e.target.id === "coll-search") { ui.collQ = e.target.value; renderCollections(el("view")); }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "fleet-type") { ui.fleetType = e.target.value; renderFleetTable(); }
    else if (e.target.classList.contains("rental-end-input")) { rentalEndDateEdit(e.target.getAttribute("data-id"), e.target.value); }
    else if (e.target.id === "bill-month") { ui.billMonth = e.target.value; render(); }
    else if (e.target.classList.contains("coll-stage-select")) { setCollectionStage(e.target.getAttribute("data-id"), e.target.value); renderCollections(el("view")); }
  });

  /* --------------------------- init --------------------------- */
  bootAuth();
})();
</script>
</body>
</html>
